<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>College Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238676d9'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#f8f3ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="College Tracker" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      // Light is the default. Dark only if chosen (or "Match system" is chosen and the system is dark).
      const t = localStorage.getItem("ct-theme");
      const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="19" height="19"><path d="M9 16.5l4.5 4.5L23 11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-name">College Tracker</span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="dashboard" class="active">Today<span class="badge" id="bellCount" hidden>0</span></button>
      <button data-tab="classes">Classes</button>
      <button data-tab="exams">Exams</button>
      <button data-tab="calendar">Calendar</button>
    </nav>
    <div class="top-actions">
      <button class="btn primary small-install" id="installBtn" hidden title="Install College Tracker as an app">Install app</button>
      <button class="icon-btn wide" id="toolsBtn" title="Focus timer, GPA, notes & settings">Tools</button>
      <button class="icon-btn" id="themeBtn" title="Toggle light / dark mode">☾</button>
    </div>
  </header>

  <main>
    <section id="view-dashboard" class="view active"></section>
    <section id="view-classes" class="view"></section>
    <section id="view-exams" class="view"></section>
    <section id="view-calendar" class="view"></section>
    <section id="view-tools" class="view"></section>
  </main>

  <dialog id="formDialog">
    <form method="dialog" id="dialogForm">
      <h2 id="dialogTitle"></h2>
      <div id="dialogFields"></div>
      <div class="dialog-actions">
        <button type="button" class="text-btn danger" id="dialogDelete" hidden>Delete</button>
        <span style="flex:1"></span>
        <button type="button" class="btn ghost" id="dialogCancel">Cancel</button>
        <button type="submit" class="btn primary" id="dialogSubmit">Save</button>
      </div>
    </form>
  </dialog>

  <div class="timer-widget" id="timerWidget" hidden>
    <button class="tw-open" id="twOpen" title="Open focus timer">
      <span class="tw-ring"></span>
      <span class="tw-text"><span id="twTime" class="tw-time">25:00</span><span id="twMode" class="tw-mode">Focus</span></span>
    </button>
    <button class="tw-btn" id="twToggle" aria-label="Pause timer"></button>
    <button class="tw-btn" id="twReset" aria-label="Reset timer" title="Reset"><svg viewBox="0 0 16 16" width="13" height="13"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="tw-btn" id="twClose" aria-label="Hide (timer keeps running)" title="Hide (timer keeps running)">✕</button>
  </div>

  <div class="alarm-card" id="alarmCard" hidden role="alertdialog" aria-labelledby="alarmTitle">
    <div class="alarm-inner">
      <div class="alarm-bell" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 3a6 6 0 0 0-6 6v3.5L4.5 15h15L18 12.5V9a6 6 0 0 0-6-6zM10 18a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 id="alarmTitle">Time's up</h2>
      <p id="alarmText" class="muted"></p>
      <div class="alarm-actions">
        <button class="btn primary" id="alarmStop">Stop alarm</button>
        <button class="btn ghost" id="alarmNext">Start break</button>
      </div>
    </div>
  </div>

  <div class="music-dock" id="musicDock" hidden>
    <div id="musicEmbed" hidden></div>
    <div class="music-bar">
      <span class="eq playing"><i></i><i></i><i></i></span>
      <span id="musicNow" class="music-now"></span>
      <button class="text-btn" id="musicPause">Pause</button>
      <button class="link-btn" id="musicStop" aria-label="Stop music">✕</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
